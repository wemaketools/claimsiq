# ClaimsIQ local Supabase stack (Supabase CLI 2.118.0, pinned in the root package.json).
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Ports are the Supabase CLI defaults plus 100, so this stack can run beside another project's default stack.
# - Only Supabase Auth is used for now: the SPA signs in with supabase-js. The schema (migrations), Postgres and
#   Storage come with the backend.
# - Email (Auth resets and invites) is caught by Mailpit.
#
# Local addresses: API gateway http://127.0.0.1:54421, Postgres 127.0.0.1:54422, Studio http://127.0.0.1:54423,
# Mailpit web UI/API http://127.0.0.1:54424, Mailpit SMTP 127.0.0.1:54425.

project_id = "claimsiq"

[api]
enabled = true
port = 54421
# The Data API is locked down by migration once the schema exists (anon/authenticated hold no privileges on public).
# The browser never uses it; supabase-js is for authentication only.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# `auto_expose_new_tables` is deliberately left at the hosted default (true). The Data API lockdown is done
# by explicit REVOKEs in migrations, and the integration test must prove them against the same default the
# hosted projects use. Turning it off locally would hide a missing REVOKE.

[api.tls]
enabled = false

[db]
port = 54422
shadow_port = 54420
health_timeout = "2m"
major_version = 17

[db.pooler]
# Local connections go straight to Postgres on 54422; the hosted poolers are used when deployed.
enabled = false
port = 54429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# No SQL seed: the fixtures load through the TypeScript loader (`bun run db:seed`), because they must pass the same
# validation and quarantine as the mock API's.
enabled = false
sql_paths = []

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1"

# Mailpit catches every email sent by the local stack. This section was called [inbucket] in older CLI
# versions (the name the design documents use). smtp_port exposes Mailpit's SMTP listener to the host so the
# ClaimsIQ email channel can deliver to 127.0.0.1:54425.
[local_smtp]
enabled = true
port = 54424
smtp_port = 54425
admin_email = "no-reply@claimsiq.local"
sender_name = "ClaimsIQ"

[storage]
# Private buckets are created by migration, never here.
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5273"
# GoTrue matches these as globs ('*' does not cross '.' or '/'; '**' does). The wildcard-port entries let other
# dev servers (for example Playwright's, 5380) receive password-reset and invitation links.
additional_redirect_urls = [
  "http://localhost:5273/reset-password",
  "http://localhost:5273/invite",
  "http://localhost:5273/invite/**",
  "http://127.0.0.1:5273/reset-password",
  "http://127.0.0.1:5273/invite",
  "http://127.0.0.1:5273/invite/**",
  "http://localhost:*/reset-password",
  "http://localhost:*/invite",
  "http://localhost:*/invite/**",
  "http://127.0.0.1:*/reset-password",
  "http://127.0.0.1:*/invite",
  "http://127.0.0.1:*/invite/**",
]
jwt_expiry = 3600
# ES256 key set generated by scripts/db/ensure-signing-keys.mjs (git-ignored). SUPABASE_JWT_SECRET is not used.
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Self-signup is disabled. Accounts are provisioned through the Auth Admin API: demo personas by
# `bun run auth:personas`, other users by the ClaimsIQ API.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
# LOCAL values only. Playwright workers and the demo walkthrough sign in from 127.0.0.1 at once, so the
# per-IP defaults (30 sign-ins per 5 minutes) would throttle them. Hosted projects keep their own limits.
email_sent = 100
sms_sent = 30
anonymous_users = 30
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 1000
web3 = 30

[auth.email]
# This flag enables the email PROVIDER (email + password sign-in). It must stay true; turning it off disables
# password sign-in entirely. New sign-ups are blocked by [auth] enable_signup = false above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# MFA and step-up sign-in are not in the initial release.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# External identity providers are off (email + password only).
[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

# Edge Functions are not used: server code runs as Vercel functions.
[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 8183
deno_version = 2

[analytics]
enabled = false
port = 54427
backend = "postgres"
