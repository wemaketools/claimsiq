# ClaimsIQ CI: one `verify` job. The local Supabase stack runs for AUTHENTICATION ONLY: the unit tests verify real
# ES256 tokens against it and the Playwright specs sign in with it. There is no application schema, so there is no
# reset, integration suite or schema validation yet; the backend work extends `verify` with them.
# App deploys are not a CI step: Vercel's Git integration builds on push.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Suppresses Supabase CLI telemetry (and its timeouts) on runners.
  DO_NOT_TRACK: '1'

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main/dev: once schema deploys exist, a cancelled `db push` could leave a schema half-migrated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print toolchain versions
        run: |
          bun --version
          bunx tsc --version
          bunx vitest --version
          bunx eslint --version
          bunx supabase --version
          bunx playwright --version

      - name: Start the local Supabase stack (Auth for real sign-in)
        run: bun run supabase:start

      - name: Write a throwaway .env.local from supabase status
        run: |
          eval "$(bunx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          test -n "$API_URL" && test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "APP_ENV=local"
            echo "LOG_LEVEL=info"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } > .env.local

      - name: Create the demo accounts in local Supabase Auth
        run: bun run auth:personas

      - name: Typecheck (backend, scripts)
        run: bun run typecheck

      - name: Typecheck (SPA)
        run: bun run typecheck:ui

      - name: Lint (backend, scripts)
        run: bun run lint

      - name: Lint (SPA, including Prettier)
        run: bun run lint:ui

      - name: Unit tests (token verification against the local stack, config, scripts)
        run: bun run test:unit

      - name: SPA tests (fail on skipped tests, enforce the count floor)
        run: bun run ci:test:ui

      - name: Build (backend typecheck + SPA production build, as on Vercel)
        run: bun run build

      - name: Security scans (tracked-file secrets, production bundle leaks)
        run: bun run ci:security

      - name: Install the Playwright browser
        working-directory: e2e_tests
        run: bunx playwright install --with-deps chromium

      - name: E2E (Playwright, axe)
        run: bun run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e_tests/playwright-report
          retention-days: 7

      - name: Stop the local Supabase stack
        if: always()
        run: bun run supabase:stop
